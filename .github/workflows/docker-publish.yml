name: Publish Docker image

# Builds the multi-arch image and pushes it to GitHub Container Registry (ghcr.io).
# Triggers on version tags (v3.0, v3.0.1, ...) and can be run manually.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU (for arm64 emulation)
        uses: docker/setup-qemu-action@v3

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Derive image metadata (tags + labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          # metadata-action lowercases the image name, so a mixed-case owner is fine.
          images: ghcr.io/${{ github.repository_owner }}/givenergy-dashboard
          tags: |
            # Our release tags are two-part (v3.0), not full semver (3.0.0), so
            # type=semver would skip them. Extract the version from the git tag
            # instead: v3.0 -> 3.0. Works for any future vX.Y too.
            type=match,pattern=v(.*),group=1
            type=raw,value=latest

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          # arm64 = Pi 4/5 (64-bit OS); arm/v7 = Pi 3 / Zero 2 (32-bit); amd64 = PCs/NAS
          platforms: linux/amd64,linux/arm64,linux/arm/v7
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
